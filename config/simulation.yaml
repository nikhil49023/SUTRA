environment: simulation
app_version: "1.0.0"
protocol_version: "1.0"
simulation_mode: true
hardware_mode: false

server:
  backend_host: "0.0.0.0"
  backend_port: 8000
  websocket_host: "0.0.0.0"
  websocket_port: 8765
  allowed_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
    - "http://localhost:80"

security:
  security_mode: "STRICT"
  websocket_auth_required: true
  session_timeout_sec: 28800 # 8 hours
  rate_limit_rpm: 300
  replay_window_sec: 60
  token_secret_env: "GCS_TOKEN_SECRET"
  jwt_secret_env: "GCS_JWT_SECRET"

logging:
  level: "INFO"
  format: "structured_json"
  log_file: "development_audit_logs/gcs_sim.log"
  max_bytes: 20971520 # 20MB
  backup_count: 7
  audit_file: "development_audit_logs/audit_sim.log"

telemetry:
  telemetry_rate_hz: 10
  hud_refresh_rate_hz: 60
  simulation_rate_hz: 10
  drone_count: 4
  max_simulated_drones: 50

ai:
  update_rate_hz: 2
  threat_threshold: 0.70
  battery_margin_pct: 25.0
  confidence_decay_half_life_sec: 5.0

mavlink:
  connection_string: "udp:127.0.0.1:14550"
  baud_rate: 115200
  heartbeat_timeout_sec: 3.0
