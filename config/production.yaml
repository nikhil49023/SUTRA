environment: production
app_version: "1.0.0"
protocol_version: "1.0"
simulation_mode: false
hardware_mode: true

server:
  backend_host: "0.0.0.0"
  backend_port: 8000
  websocket_host: "0.0.0.0"
  websocket_port: 8765
  allowed_origins:
    - "https://gcs.smarthorizon.io"
    - "https://tactical.smarthorizon.internal"

security:
  security_mode: "STRICT"
  websocket_auth_required: true
  session_timeout_sec: 7200 # 2 hours
  rate_limit_rpm: 120
  replay_window_sec: 30
  token_secret_env: "GCS_TOKEN_SECRET"
  jwt_secret_env: "GCS_JWT_SECRET"

logging:
  level: "INFO"
  format: "structured_json"
  log_file: "/var/log/smart-horizon/gcs_prod.log"
  max_bytes: 104857600 # 100MB
  backup_count: 30
  audit_file: "/var/log/smart-horizon/audit_prod.log"

telemetry:
  telemetry_rate_hz: 10
  hud_refresh_rate_hz: 60
  simulation_rate_hz: 10
  drone_count: 4

ai:
  update_rate_hz: 2
  threat_threshold: 0.60
  battery_margin_pct: 30.0
  confidence_decay_half_life_sec: 2.0

mavlink:
  connection_string: "udp:0.0.0.0:14550"
  baud_rate: 57600
  heartbeat_timeout_sec: 1.5
