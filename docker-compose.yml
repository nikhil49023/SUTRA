version: '3.8'

services:
  # 1. ROS 2 Workspace & Simulation Core
  sutra_sim_core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sutra_sim_core
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - DISPLAY=${DISPLAY}
    volumes:
      - ./sutra_ws:/sutra_ws/sutra_ws
      - ./scripts:/sutra_ws/scripts
      - ./docs:/sutra_ws/docs
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    ipc: host
    command: bash -c "python3 scripts/SUTRA_48Hr_Hackathon_Master_Suite.py"

  # 2. Subsystem D: 3D GIS Ground Control Station
  sutra_gcs_frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sutra_gcs_frontend
    working_dir: /sutra_ws/sutra_ws/src/sutra_gcs
    ports:
      - "5173:5173"
    environment:
      - VITE_MAPBOX_TOKEN=${VITE_MAPBOX_TOKEN:-pk.sample_token}
    command: bash -c "npm install && npm run dev -- --host 0.0.0.0"
