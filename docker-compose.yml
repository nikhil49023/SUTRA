version: '3.8'

services:
  # 1. Subsystem A: GNC & 3D Gazebo Sim 8 Visual Environment (noVNC Browser Display + NVIDIA GPU)
  sutra_sim_novnc:
    build:
      context: .
      dockerfile: Dockerfile.novnc
    container_name: sutra_sim_novnc
    ports:
      - "8080:8080" # noVNC Web GUI Browser Interface
      - "5900:5900" # VNC direct RFB port
      - "9090:9090" # GCS Telemetry WebSocket Gateway
    environment:
      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all,utility,graphics,compute,display
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, graphics, compute, display, utility]
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    ipc: host
    command: ros2 launch sutra_sim phase1_flight.launch.py headless:=false

  # 2. Subsystem D: 3D GIS Ground Control Station (GCS Dashboard)
  sutra_gcs_frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sutra_gcs_frontend
    working_dir: /sutra_ws/src/sutra_gcs
    ports:
      - "5173:5173"
    environment:
      - VITE_MAPBOX_TOKEN=${VITE_MAPBOX_TOKEN:-pk.sample_token}
    command: bash -c "npm install && npm run dev -- --host 0.0.0.0"
