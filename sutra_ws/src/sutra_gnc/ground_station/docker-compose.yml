version: '3.8'

services:
  gcs-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=http://fastapi-backend:8000/api/v1
      - VITE_WS_BASE_URL=ws://fastapi-backend:8000/ws/mavlink
    restart: always

  postgres-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sutra_gcs_db
      POSTGRES_USER: gcs_operator
      POSTGRES_PASSWORD: secure_tactical_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
