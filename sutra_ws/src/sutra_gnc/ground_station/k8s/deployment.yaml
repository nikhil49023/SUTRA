apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-horizon-gcs-deployment
  namespace: sutra-uav-system
  labels:
    app: smart-horizon-gcs
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smart-horizon-gcs
  template:
    metadata:
      labels:
        app: smart-horizon-gcs
        tier: frontend
    spec:
      containers:
        - name: gcs-frontend
          image: ghcr.io/nikhil49023/smart-horizon-gcs:v1.5.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - configMapRef:
                name: gcs-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
