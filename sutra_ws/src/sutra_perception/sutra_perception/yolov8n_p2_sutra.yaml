# YOLOv8n-P2 Custom Architecture for Aerial Small-Target SAR Perception
# Adds high-resolution P2 (160x160) feature detection head for tiny humans from 15m-50m altitude.

nc: 3  # number of classes (0: person, 1: backpack, 2: vehicle)
scales:
  n: [0.33, 0.25, 1024]  # YOLOv8-nano scale

# YOLOv8 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]   # 0-P1/2 (320x320)
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4 (160x160)
  - [-1, 3, C2f, [128, True]]   # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8 (80x80)
  - [-1, 6, C2f, [256, True]]   # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16 (40x40)
  - [-1, 6, C2f, [512, True]]   # 6-P4/16
  - [-1, 1, Conv, [512, 3, 2]]  # 7-P5/32 (20x20)
  - [-1, 3, C2f, [512, True]]   # 8-P5/32
  - [-1, 1, SPPF, [512, 5]]     # 9-P5/32

# YOLOv8-P2 head with 4 detection scales (P2, P3, P4, P5)
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 6], 1, Concat, [1]]  # cat backbone P4
  - [-1, 3, C2f, [512]]  # 12

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]  # cat backbone P3
  - [-1, 3, C2f, [256]]  # 15

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 2], 1, Concat, [1]]  # cat backbone P2 (High Resolution 160x160)
  - [-1, 3, C2f, [128]]  # 18 (P2/4-small)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]  # cat head P3
  - [-1, 3, C2f, [256]]  # 21 (P3/8-medium)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]  # cat head P4
  - [-1, 3, C2f, [512]]  # 24 (P4/16-large)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]  # cat head P5
  - [-1, 3, C2f, [512]]  # 27 (P5/32-extra large)

  - [[18, 21, 24, 27], 1, Detect, [nc]]  # Detect(P2, P3, P4, P5)
