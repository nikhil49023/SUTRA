; SUTRA Subsystem B: Swarm Communication & LoRa Telemetry ESP32 Firmware
; Lead Engineer & Tech Architect: Nikhil
; Framework: PlatformIO / Arduino C++

[platformio]
default_envs = node1_tx_drone, node2_rx_gcs

[env:node1_tx_drone]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
src_filter = +<node1_tx_drone.cpp>
lib_deps =
    jgromes/RadioLib @ ^6.0.0
    bblanchon/ArduinoJson @ ^6.21.3
build_flags =
    -D SUTRA_NODE_TYPE_TX
    -D LORA_NSS=5
    -D LORA_SCK=18
    -D LORA_MISO=19
    -D LORA_MOSI=23
    -D LORA_RST=14
    -D LORA_DIO0=2

[env:node2_rx_gcs]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
src_filter = +<node2_rx_gcs.cpp>
lib_deps =
    jgromes/RadioLib @ ^6.0.0
    bblanchon/ArduinoJson @ ^6.21.3
build_flags =
    -D SUTRA_NODE_TYPE_RX
    -D LORA_NSS=5
    -D LORA_SCK=18
    -D LORA_MISO=19
    -D LORA_MOSI=23
    -D LORA_RST=14
    -D LORA_DIO0=2
