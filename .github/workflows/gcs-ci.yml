name: Ground Control Station (GCS) CI

on:
  push:
    branches: [ feature/subsystem-d-gcs, main, dev ]
    paths:
      - 'sutra_ws/src/sutra_gcs/**'
      - 'sutra_ws/src/sutra_gnc/ground_station/**'
  pull_request:
    branches: [ feature/subsystem-d-gcs, main, dev ]
    paths:
      - 'sutra_ws/src/sutra_gcs/**'
      - 'sutra_ws/src/sutra_gnc/ground_station/**'

jobs:
  gcs_build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sutra_ws/src/sutra_gnc/ground_station
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: npm install

      - name: Build GCS Dashboard
        run: npm run build
