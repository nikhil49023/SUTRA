name: ROS 2 Colcon Build & Test CI

on:
  push:
    branches: [ feature/subsystem-d-gcs, main, dev ]
  pull_request:
    branches: [ feature/subsystem-d-gcs, main, dev ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff setuptools

      - name: Test Python Subsystems
        run: |
          pytest sutra_ws/src/sutra_gnc/test/ || true
          pytest sutra_ws/src/sutra_comms/test/ || true
          pytest sutra_ws/src/sutra_perception/test/ || true

      - name: Verify Master Rehearsal Script
        run: |
          python scripts/SUTRA_48Hr_Hackathon_Master_Suite.py --help || true
