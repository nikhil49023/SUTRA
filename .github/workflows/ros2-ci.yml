name: Project SUTRA Monorepo CI Pipeline

on:
  push:
    branches: [ main, dev, 'feature/**' ]
  pull_request:
    branches: [ main, dev ]

jobs:
  deterministic-test-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Monorepo Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest-cov

      - name: Run Deterministic Monorepo PyTest Suite (Zero-Mock Strict Evaluation)
        run: |
          pytest sutra_ws/src/sutra_gnc/test/ -q
          pytest sutra_ws/src/sutra_perception/test/ -q
          pytest sutra_ws/src/sutra_comms/test/ -q
          pytest sutra_ws/src/sutra_sim/test/ -q

      - name: Verify Master Integration Script Syntax
        run: |
          python3 scripts/SUTRA_48Hr_Hackathon_Master_Suite.py --help
